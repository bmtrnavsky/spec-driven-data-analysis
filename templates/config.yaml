# .analysis/config.yaml — human-owned (SPEC §4, §4.5).
# Changing this file changes the lock hash; data reads block until re-lock.
version: 1

# Starting proposal only; the spec is where tier is stored (SPEC §2).
default_tier: EXPLORE

# Data-root aliases. Each alias needs at least one locator.
# Credentials are referenced by name only: conn: env:NAME or vault:NAME.
data_roots: {}
# Example:
# data_roots:
#   sales:
#     paths: ["D:/data/sales"]
#     hosts: []
#     url_prefixes: []
#     tool_patterns: []
#     pii: false
#     pii_columns: []
#     # Tier floor for sources read under this alias (SPEC §2.2, §4.5).
#     # EXPLORE, DECIDE, or PUBLISH; pii: true (or non-empty
#     # pii_columns) implies at least DECIDE. Human-owned: the spec
#     # text can never lower this.
#     min_tier: EXPLORE

# Publish channels (SPEC §6.5): tool-name regexes and paths that publish.
# In a bound session, a call through one of these that carries this
# workdir's report is blocked unless tier is PUBLISH with verified sign-off.
publish_channels: {}
# Example:
# publish_channels:
#   vault:
#     paths: ["C:/Users/bmtrn/vault"]
#   wordpress:
#     tool_patterns: ["^mcp__wordpress__.*"]

# Approver keys (SPEC §4.5). Human-owned: only a string-match hook guards
# this block, so it is never trusted on its own — `dda approved` walks the
# chain from the first (trust-on-first-use) config approval.
# The first `dda approve config` must be signed by Brad himself; `dda init`
# prints these fingerprints for him to confirm.
approvers: []
# Example:
# approvers:
#   - name: brad
#     fingerprint: SHA256:4ntXMUfsddmYgfM8kddKrKTq2nTdB3Qy/cSUPR0kJWw
#     # key: ssh-ed25519 AAAAC3... (full public key also accepted)
#     telegram_user_id: "8919091876"  # Telegram confirmations (`dda approve --telegram`) count as signed
#     chat_user_id: "brad"            # regular-chat confirmations (`dda approve --chat`) count as signed
