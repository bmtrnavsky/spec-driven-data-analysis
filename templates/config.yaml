# .analysis/config.yaml — human-owned (SPEC §4, §4.5).
# Changing this file changes the lock hash; data reads block until re-lock.
version: 1

# Starting proposal only; the spec is where tier is stored (SPEC §2).
default_tier: EXPLORE

# Data-root aliases. Each alias needs at least one locator.
# Credentials are referenced by name only: conn: env:NAME or vault:NAME.
data_roots: {}
# Example:
# data_roots:
#   sales:
#     paths: ["D:/data/sales"]
#     hosts: []
#     url_prefixes: []
#     tool_patterns: []
#     pii: false
#     pii_columns: []

# Publish channels (SPEC §6.5): tool-name regexes and paths that publish.
# In a bound session, a call through one of these that carries this
# workdir's report is blocked unless tier is PUBLISH with verified sign-off.
publish_channels: {}
# Example:
# publish_channels:
#   vault:
#     paths: ["C:/Users/bmtrn/vault"]
#   wordpress:
#     tool_patterns: ["^mcp__wordpress__.*"]
